services:
  xesxor-bot:
    build: .
    container_name: xesxor_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-10000}:10000"
    environment:
      - DATABASE_PATH=/app/data/bot_database.db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
